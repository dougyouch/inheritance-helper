AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'vendor/**/*'
    - 'coverage/**/*'

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
    - '*.gemspec'

Style/FrozenStringLiteralComment:
  EnforcedStyle: always

Layout/LineLength:
  Max: 120
  Exclude:
    - 'spec/**/*'

# the gem name is hyphenated
Naming/FileName:
  Exclude:
    - 'lib/inheritance-helper.rb'

# create_class takes its arguments positionally
Metrics/ParameterLists:
  Max: 5
  CountKeywordArgs: false
